id: kalima_sawaa
name: كلمة سواء
enabled: true
# Comments off: applied automatically on Instagram. Facebook and TikTok have no API for it
# (see docs/comments.md); YouTube is set in YouTube Studio.
comments: off

min_slot_spacing_minutes: 120

slots:
  morning: { type: fixed, at: "10:00", jitter_minutes: 45 }
  afternoon: { type: fixed, at: "14:00", jitter_minutes: 45 }
  evening: { type: fixed, at: "18:30", jitter_minutes: 45 }
  night: { type: fixed, at: "22:00", jitter_minutes: 45 }

text_source:
  type: filename               # {title} = file name without extension
  strip_prefixes: ["Copy of ", "نسخة من "]
  replacements:
    "⧸": "/"                   # tg2drive writes "/" in captions as "⧸"; ? : | are kept as they are
    # full-width characters that video downloaders put in the long folder's file names
    "：": ":"
    "？": "?"
    "｜": "|"
    "＂": "\""
  skip_titles: ["معاذ عليان"]   # reel without a caption: not posted, one Telegram alert per file

# Every video is checked before it is used, by an open language model that runs on the GitHub runner
# (no key, no quota): the title is rewritten if needed (insults, mockery, shock-bait and group
# generalizations removed, topic kept), and what is said in the reel is transcribed by Whisper and judged too.
# Videos judged "high" risk are held back with a Telegram alert and the next one is used. Exception: a title
# that is "high" on its own gets a new title (from the title or the transcript) when the speech passes the audio check. If the model or
# Whisper fails, nothing is posted (retried next run). The `prescreen` workflow checks the next videos ahead
# of time. Rename a held-back file and it is checked again under its new name.
title_guard:
  enabled: true
  provider: local              # local | openai_compatible (e.g. Groq free tier) | anthropic
  gguf_repo: Qwen/Qwen3-8B-GGUF
  gguf_file: Qwen3-8B-Q4_K_M.gguf
  # Groq instead (free key from console.groq.com, stored as the GROQ_API_KEY secret):
  #   provider: openai_compatible
  #   base_url: https://api.groq.com/openai/v1
  #   model: llama-3.3-70b-versatile
  #   api_key_secret: GROQ_API_KEY
  block_levels: [high]
  audio:
    enabled: true
    streams: [short]           # long videos are not transcribed
    whisper_model: large-v3    # large-v3-turbo is ~4x faster and a little less accurate
    max_seconds: 180
  context: |
    The reels are made by Moaz Alyan, who allows reposting. The page presents religious texts and claims for
    discussion; it must read as respectful dialogue.

streams:
  short:                       # filled by tg2drive (ShadyYasser/tg2drive) from the Telegram group
    drive_folder_id: "1qf_opI5CAtrP5iDn3goNxAZY23rj7Z4c"
    order: newest_first        # every slot posts the newest unposted reel (highest Telegram msg_id)
    slots: [morning, afternoon, evening, night]
    backfill:                  # daily-summary stats only: new reels vs the initial 400
      size: 400                # its last msg_id is fixed in state once 400 reels are in the folder
      boundary_msg_id: null    # or set the last backfill msg_id here by hand
    media:
      transcode: codec_only    # (not used while `frame` is set: framed videos are always re-encoded once)
      upscale: false
    frame:                     # logo on top, the reel in a rounded window, source credit below (1080x1920)
      credit: "المصدر: معاذ عليان"
    # Edits cut from the reel itself, so the upload is not a plain copy of the source (no text is added to the
    # picture). Times come from the Whisper transcript of the audio check; the cold open sentence is chosen by
    # the same language model, and a reel with no clearly suitable sentence simply gets none.
    edits:
      hook: { enabled: true, min_seconds: 1.5, max_seconds: 6, skip_first_seconds: 8 }   # cold open
      zoom: { enabled: true, factor: 1.07, min_shot_seconds: 4 }                          # light punch-in cuts
      # A decorative clip blended over the picture at 10%: one file per reel, the next file each time.
      # Put any clips you have the right to use in the folder; black-background effects work best with `screen`.
      overlay: { enabled: true, dir: "assets/kalima_sawaa/overlays", opacity: 0.10, blend: screen }
      # A brighter line that travels around the window and closes exactly as the reel ends.
      progress: { enabled: true, color: "#ffd98a", width: 9, glow: 6 }
      # The logo animation closes every reel; it is sped up to keep the post under 178s, and left out when
      # even x2.5 would not fit.
      outro: { enabled: true, path: "assets/kalima_sawaa/outro.mp4", max_total_seconds: 178, max_speed: 2.5 }
    cover: random_frame        # cover/thumbnail = a random good frame (Instagram + TikTok/YouTube via Buffer)
    platforms: [facebook, instagram, tiktok, youtube, pinterest]
  long:
    drive_folder_id: "1MKCjqE2rKpeT3dGfYtwe7LmYhnZ6CGdP"
    slots: [night]             # the 22:00 slot posts BOTH a short and a long video
    platforms: [youtube, facebook]
    overrides:
      youtube:
        provider: direct       # manual Telegram hand-off while youtube_direct.enabled is false
        shorts_check: null
        fallback: null
      facebook:
        format: video

# Moaz Alyan is credited by name and with his hashtag on every platform (the frame credits him on the video).
# Keep the hashtag set short: a few relevant tags read better than a long list.
templates:
  facebook:  { text: "{title}\n\nالمصدر: معاذ عليان\n#معاذ_عليان #كلمة_سواء #حوار_الأديان{tags}" }
  instagram: { text: "{title}\n\nالمصدر: معاذ عليان\n#معاذ_عليان #كلمة_سواء #حوار_الأديان #مقارنة_الأديان{tags}" }
  tiktok:    { text: "{title} #معاذ_عليان #كلمة_سواء #حوار_الأديان{tags}" }
  youtube:   { title: "{title}", description: "{title}\n\nالمصدر: معاذ عليان\n#معاذ_عليان #كلمة_سواء #حوار_الأديان{tags} #Shorts" }
  pinterest: { title: "{title}", description: "{title}\n\nالمصدر: معاذ عليان" }

platforms:
  facebook:
    provider: direct
    page_id: "1177142762151237"
    token_secret: META_PAGE_TOKEN_KALIMA
    format: reel
  instagram:
    provider: direct
    ig_user_id: "17841411727741746"
    token_secret: META_PAGE_TOKEN_KALIMA
  tiktok:
    provider: buffer
    buffer_account: tiktok_acct
    channel: "kalima.sawaa.official"
  youtube:
    provider: buffer
    buffer_account: youtube_acct
    channel: "Kalima Sawaa"
    shorts_check: { vertical: true, max_seconds: 180 }
    fallback: direct
    privacy: private
    category_id: "27"
    refresh_token_secret: YOUTUBE_REFRESH_TOKEN_KALIMA
  pinterest:
    provider: direct
    enabled: false             # turn on once the board id and Pinterest secrets are set
    board_id: "REPLACE_WITH_PINTEREST_BOARD_ID"
    refresh_token_secret: PINTEREST_REFRESH_TOKEN_KALIMA
