name: autopost

on:
  schedule:
    # Every 30 minutes at off-peak minutes. Does nothing until cron_enabled: true in config/settings.yaml.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: publish nothing, write nothing"
        type: boolean
        default: true
      command:
        description: "What to run"
        type: choice
        options: [run, test-post, check, sources, validate, plan, status]
        default: run
      brand:
        description: "Only this brand id (empty = all)"
        type: string
        default: ""
      now:
        description: "Dry run only: pretend it is this local time, e.g. 2026-10-27T17:37"
        type: string
        default: ""
      download:
        description: "Dry run only: also download, transcode and ffprobe each video"
        type: boolean
        default: false
      platform:
        description: "test-post only: facebook | instagram | tiktok | youtube | pinterest"
        type: string
        default: ""
      stream:
        description: "test-post only (optional): e.g. long for Kalima Sawaa long videos"
        type: string
        default: ""
      video:
        description: "test-post only (optional): last | file name | Drive id (default: next unposted)"
        type: string
        default: ""
      trigger:
        description: "manual, or cron for the external scheduler (cron runs obey cron_enabled)"
        type: string
        default: "manual"

permissions:
  contents: write   # commit state/state.db and manage the media-temp release

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  autopost:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONPATH: src
      PYTHONUNBUFFERED: "1"
      # All repository secrets as one JSON object; config refers to secrets by name,
      # so adding a brand never requires editing this workflow.
      SECRETS_JSON: ${{ toJSON(secrets) }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      COMMAND: ${{ github.event_name == 'workflow_dispatch' && inputs.command || 'run' }}
      BRAND: ${{ github.event_name == 'workflow_dispatch' && inputs.brand || '' }}
      NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.now || '' }}
      DOWNLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.download || false }}
      PLATFORM: ${{ github.event_name == 'workflow_dispatch' && inputs.platform || '' }}
      STREAM: ${{ github.event_name == 'workflow_dispatch' && inputs.stream || '' }}
      VIDEO: ${{ github.event_name == 'workflow_dispatch' && inputs.video || '' }}
      AUTOPOST_TRIGGER: ${{ github.event_name == 'schedule' && 'cron' || inputs.trigger || 'manual' }}
    steps:
      # Check out the branch tip at job start (not the commit at trigger time): a run that waited in
      # the concurrency queue must see the state committed by the run before it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          if { [ "$COMMAND" = "run" ] || [ "$COMMAND" = "test-post" ]; } && ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null
          fi

      - name: Run
        env:
          AUTOPOST_COMMIT_STATE: ${{ (github.event_name != 'workflow_dispatch' || !inputs.dry_run) && inputs.command != 'test-post' && '1' || '0' }}
        run: |
          set -euo pipefail
          args=()
          case "$COMMAND" in
            run)
              [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
              [ -n "$BRAND" ] && args+=(--brand "$BRAND")
              [ -n "$NOW" ] && args+=(--now "$NOW")
              [ "$DOWNLOAD" = "true" ] && args+=(--download)
              ;;
            test-post)
              args+=(--brand "$BRAND" --platform "$PLATFORM")
              [ -n "$STREAM" ] && args+=(--stream "$STREAM")
              [ -n "$VIDEO" ] && args+=(--video "$VIDEO")
              ;;
            check) args+=(--ping-telegram) ;;
            sources) [ -n "$BRAND" ] && args+=(--brand "$BRAND") ;;
            validate) args+=(--check-secrets) ;;
            plan) [ -n "$BRAND" ] && args+=(--brand "$BRAND") ;;
          esac
          python -m autopost "$COMMAND" "${args[@]}"

      - name: Commit state
        if: always() && ((env.COMMAND == 'run' && env.DRY_RUN != 'true') || env.COMMAND == 'test-post')
        run: bash scripts/commit_state.sh "run ${{ github.run_id }}"
